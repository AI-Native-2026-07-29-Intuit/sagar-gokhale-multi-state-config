# argocd/projects/multistate.yaml
# AppProject scoping the multistate capstone team. Every Application in this
# assignment sets spec.project: multistate -- never "default".
# Task 1: a working-but-loose project just enough to sync the dev
# Application. Task 2 tightens clusterResourceWhitelist/RBAC/syncWindows.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: multistate
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: multistate-api capstone -- GitOps overlays + observability

  sourceRepos:
    - https://github.com/AI-Native-2026-07-29-Intuit/sagar-gokhale-multi-state-config.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: multistate-dev
    - server: https://kubernetes.default.svc
      namespace: multistate-staging
    - server: https://kubernetes.default.svc
      namespace: multistate-prod

  clusterResourceWhitelist: []

  # Kinds actually present in base/: includes StatefulSet + Ingress +
  # AlertmanagerConfig, which the curriculum reference snippet's list omits
  # because its toy manifest set doesn't run Postgres/Mongo/Kafka/Redis as
  # StatefulSets or expose the API via Ingress. ResourceQuota/LimitRange are
  # deliberately whitelisted (not blacklisted as the curriculum suggests) --
  # see Task 2 note in GITOPS.md for why.
  namespaceResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: "", kind: Service}
    - {group: "", kind: ConfigMap}
    - {group: "", kind: Secret}
    - {group: "", kind: ServiceAccount}
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}
    - {group: apps, kind: Deployment}
    - {group: apps, kind: StatefulSet}
    - {group: autoscaling, kind: HorizontalPodAutoscaler}
    - {group: policy, kind: PodDisruptionBudget}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: networking.k8s.io, kind: Ingress}
    - {group: monitoring.coreos.com, kind: ServiceMonitor}
    - {group: monitoring.coreos.com, kind: PrometheusRule}
    - {group: monitoring.coreos.com, kind: AlertmanagerConfig}
