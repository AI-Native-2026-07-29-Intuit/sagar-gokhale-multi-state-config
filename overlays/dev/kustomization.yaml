# overlays/dev/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: multistate-dev

commonAnnotations:
  argocd.argoproj.io/sync-wave: "0"

# The dev overlay is the seam _bump-config.yml (app-repo CI) rewrites on every
# green main build going forward. Pinned here to the tag actually running in
# the cluster today (0.1.9) rather than base's stale 0.1.1 -- letting Argo CD
# selfHeal against the older base tag would roll a running deployment BACK.
images:
  - name: uptimecrew/multistate-api
    newName: uptimecrew/multistate-api
    newTag: "0.1.9"
