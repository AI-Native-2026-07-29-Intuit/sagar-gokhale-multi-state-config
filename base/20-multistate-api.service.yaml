# manifests/20-multistate-api.service.yaml - stable in-cluster name.
#
# ClusterIP only. External traffic arrives through the Ingress
# (60-multistate-api.ingress.yaml), which is the one component that owns the
# shared load balancer — a `type: LoadBalancer` here would provision a second
# one per service and, on a real cloud provider, bill for it.
#
# The selector MUST match the Deployment's POD labels (not the Deployment's own
# metadata.labels). When it doesn't, nothing errors: the Service is created, the
# pods are Running, and the EndpointSlice is simply empty, so every request
# 503s. scripts/k8s-smoke.sh asserts a ready endpoint exists before it curls,
# precisely to surface that as a labelled failure rather than a timeout.

apiVersion: v1
kind: Service
metadata:
  name: multistate-api
  namespace: multistate-dev
  labels:
    app.kubernetes.io/name: multistate-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: multistate
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: multistate-api
  ports:
    - name: http
      port: 8080
      targetPort: http # the NAMED container port, so a container-port change
      # doesn't silently break routing here
      protocol: TCP
