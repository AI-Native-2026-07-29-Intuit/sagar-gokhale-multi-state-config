# manifests/40-multistate-api.secret.yaml - secret env.
#
# THIS FILE MUST NEVER CONTAIN A REAL PASSWORD. The committed value is an
# obvious placeholder; every environment overwrites it before the app starts:
#   - CI  : .github/workflows/k8s-ci.yml seeds it from the CI_PG_PASSWORD
#           Actions secret via `kubectl create secret ... | kubectl apply -f -`
#           BEFORE `kubectl apply -f manifests/` runs.
#   - prod: an External Secrets Operator pull from the real secrets manager.
#   - local: scripts/k8s-up.sh generates a random one per cluster.
#
# `stringData`, not `data`: stringData takes plaintext and lets Kubernetes do
# the base64 encoding. Hand-base64'ing into `data` buys no security whatsoever
# (base64 is an encoding, not encryption) while making the value unreviewable
# in a diff and easy to corrupt with a stray newline from `echo` vs `printf`.
#
# Note that a Secret is only base64 at rest in etcd by default — it is NOT
# encrypted unless the cluster enables encryption-at-rest. The protection that
# matters here is that the real value never enters git.

apiVersion: v1
kind: Secret
metadata:
  name: multistate-api-secrets
  namespace: multistate-dev
  labels:
    app.kubernetes.io/name: multistate-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: multistate
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  # Overrides spring.datasource.password. Postgres itself reads the same key
  # via secretKeyRef (see 05-postgres.yaml) so the two can never disagree.
  SPRING_DATASOURCE_PASSWORD: replace-at-apply-time-from-secrets-manager
